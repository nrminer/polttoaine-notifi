<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <title>BensaVahti — Suomen polttoainehintojen ennustaja</title>
    <meta name="description" content="Algoritmi joka ennustaa huomisen 95E10- ja diesel-hinnat Suomeen." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&display=swap">
    <script>
      // Apply theme before first paint (no flash). Default = dark.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.toggle("dark", t === "dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0A0F1C" : "#FFFFFF");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>JavaScript on tarpeen tämän sovelluksen käyttämiseen.</noscript>
    <div id="root"></div>
  </body>
</html>
