name: Check gas prices

on:
  schedule:
    # TESTING: every 5 minutes. Revert to "0 */2 * * *" once verified.
    - cron: "*/5 * * * *"
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the job can commit state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run price check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PRICE_THRESHOLD: ${{ vars.PRICE_THRESHOLD }}
          CITIES: Helsinki,Vantaa,Espoo
        run: python check_prices.py

      - name: Commit updated state
        run: |
          git config user.name  "gas-alert-bot"
          git config user.email "gas-alert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state $(date -u +%FT%TZ)"
          git push
